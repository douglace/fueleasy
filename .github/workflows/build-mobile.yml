# Build Mobile — Fueleasy Mobile (Flutter)
#
# Triggered on tags matching mobile-v*.*.*.
# Builds Android (AAB + APK) release binary.
# iOS build runs independently — fails gracefully when signing secrets are missing.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   — Base64-encoded upload keystore (.jks)
#   ANDROID_KEY_ALIAS         — Keystore key alias
#   ANDROID_KEY_PASSWORD      — Key password
#   ANDROID_STORE_PASSWORD    — Keystore password
#   PLAY_STORE_SERVICE_ACCOUNT_JSON — Raw JSON key of the Play publisher service
#                               account (uploads the AAB to the internal track)
#
# Optional secrets (iOS — build is skipped when absent):
#   IOS_P12_BASE64            — Base64-encoded .p12 signing certificate
#   IOS_P12_PASSWORD          — Password for the .p12 certificate
#   IOS_PROVISION_PROFILE_BASE64 — Base64-encoded provisioning profile

name: Build Mobile

on:
  push:
    tags:
      - 'mobile-v*.*.*'

permissions:
  contents: write

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check iOS and Play Store secrets availability
    runs-on: ubuntu-latest
    outputs:
      has_ios_secrets: ${{ steps.check.outputs.has_secrets }}
      has_play_secrets: ${{ steps.check.outputs.has_play_secrets }}
    steps:
      - id: check
        env:
          IOS_P12: ${{ secrets.IOS_P12_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$IOS_P12" ]; then
            printf 'has_secrets=true\n' >> "$GITHUB_OUTPUT"
            printf '::notice::iOS signing secrets detected — iOS build will run.\n'
          else
            printf 'has_secrets=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::iOS signing secrets not configured — iOS build will be skipped.\n'
          fi
          if [ -n "$PLAY_JSON" ]; then
            printf 'has_play_secrets=true\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Play Store secret detected — AAB will be uploaded to the internal track.\n'
          else
            printf 'has_play_secrets=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::PLAY_STORE_SERVICE_ACCOUNT_JSON not configured — Play Store upload will be skipped.\n'
          fi

  build-android:
    name: Build Android (AAB + APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Decode keystore
        working-directory: apps/mobile/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties
        working-directory: apps/mobile/android
        run: |
          cat > key.properties << EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build AAB (App Bundle)
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://fusy.velko-pos.com

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://fusy.velko-pos.com

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (IPA)
    needs: preflight
    if: needs.preflight.outputs.has_ios_secrets == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        working-directory: apps/mobile
        run: flutter build ipa --release --dart-define=API_BASE_URL=https://fusy.velko-pos.com --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/build/ios/ipa/*.ipa

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  publish:
    name: Publish Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release/android

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/android

      - name: Download iOS IPA (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: release/ios

      - name: Create internal GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fusy Mobile ${{ github.ref_name }}"
          body: "Release GitHub pour le téléchargement de l'APK Fusy."
          generate_release_notes: true
          files: |
            release/android/*.aab
            release/android/*.apk
            release/ios/*.ipa

  publish-play-store:
    name: Upload to Play Store (internal)
    needs: [preflight, build-android]
    if: needs.preflight.outputs.has_play_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps/mobile/distribution

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release/android

      - name: Upload AAB to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.fueleasy.mobile
          releaseFiles: release/android/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: apps/mobile/distribution/whatsnew
