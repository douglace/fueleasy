services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fusy
      POSTGRES_USER: fusy
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - fusy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusy -d fusy"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Fusy
      APP_ENV: local
      # Clé stable : évite d'invalider les sessions/CSRF à chaque rebuild d'image.
      APP_KEY: base64:zCeTgPLJmnZpqi2UoqLE34RILhJxGUY/ybTEM0IYJvU=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: fusy
      DB_USERNAME: fusy
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3 --timeout=60
    entrypoint: []
    environment:
      APP_NAME: Fusy
      APP_ENV: local
      APP_KEY: base64:zCeTgPLJmnZpqi2UoqLE34RILhJxGUY/ybTEM0IYJvU=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: fusy
      DB_USERNAME: fusy
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  fusy-db: {}
